# One catalogue for the whole repository. build-logic reads it with from(files("../gradle/libs.versions.toml")).

[versions]
junit = "6.1.3"
assertj = "3.27.7"
lombok = "1.18.48"
slf4j = "2.0.20"
log4j = "2.26.1"
jackson3 = "3.3.0"
json-schema-validator = "3.0.9"
# The airgap agent: Byte Buddy inside the agent jar; JUnit 5 for the parts and tests that run on JDK 8.
byte-buddy = "1.18.17"
junit5 = "5.14.4"
gradle-shadow-plugin = "9.6.1"
# Common clients the agent's own tests prove refused on every JDK: HTTP clients, Netty, JDBC drivers.
apache-httpclient4 = "4.5.14"
apache-httpclient5 = "5.6.5"
okhttp = "5.5.1"
netty = "4.2.21.Final"
postgresql = "42.7.15"
mysql-connector = "26.10.0"
# Mockito 4 is the last to run on JDK 8; its inline mock maker rewrites classes as the agent does.
mockito4 = "4.11.0"
# The Gradle wiring is compiled against the oldest Gradle it supports, and tested on the latest of each major version.
gradle-oldest-supported = "5.6.4"
gradle-tested = "5.6.4,6.9.4,7.6.6,8.14.8"
# The Maven extension is compiled against the oldest Maven it supports, and tested on the latest of each line (Maven 4
# on its newest release candidate until 4.0 is out).
maven-oldest-supported = "3.6.3"
maven-tested = "3.6.3,3.8.9,3.9.16,4.0.0-rc-7"
javax-inject = "1"

# The quality tools themselves come with the java-conventions plugin. SpotBugs' annotations, for its suppressions.
spotbugs = "4.10.5"
# The share of planted bugs the agent's unit tests must catch.
min-mutation-score = "90"

# Gradle plugins applied by build-logic
# Publishing: Maven Central through its Central Portal, the Gradle Plugin Portal, and a CycloneDX bill of materials
nmcp = "1.6.2"
cyclonedx = "3.6.1"
gradle-plugin-publish = "2.2.1"

[libraries]
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson3-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson3" }
byte-buddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byte-buddy" }
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit5-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit5-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
gradle-api-oldest-supported = { module = "dev.gradleplugins:gradle-api", version.ref = "gradle-oldest-supported" }
junit4 = { module = "junit:junit", version = "4.13.2" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven-oldest-supported" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax-inject" }
apache-httpclient4 = { module = "org.apache.httpcomponents:httpclient", version.ref = "apache-httpclient4" }
apache-httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "apache-httpclient5" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
mockito4-core = { module = "org.mockito:mockito-core", version.ref = "mockito4" }
mockito4-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito4" }
byte-buddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "byte-buddy" }

# Gradle plugins, as ordinary dependencies of build-logic
gradle-nmcp-plugin = { module = "com.gradleup.nmcp:nmcp", version.ref = "nmcp" }
gradle-cyclonedx-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "gradle-shadow-plugin" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
