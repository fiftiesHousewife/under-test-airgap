    blocked_by:
      - "report-writer"
      - "decide-what-counts-as-a-file-write"
    notes: "Done, not yet released: 14 hooks (FileHooks) on FileOutputStream, RandomAccessFile, File, the default file system's provider and the secure directory stream, each checked at start; FileWritesTest makes each kind of write for real outside the project on JDK 8 to 25; the JDK routes test found the secure directory stream, now hooked, and the routes that only read or change a file's times, owner or permissions, now reviewed. The real-project runs gave the same test results as without the hooks (PetClinic 81 pass, RealWorld all pass, Halo only its 7 Redis tests fail as without the agent, the gateway guide passes, the 2020 REST guide fails on its dead service as offline), with no slowdown. Only Halo wrote outside its folder: its H2 database and Spring's log file in the home folder (~/.halo, ~/halo-demo, ~/halo-test). Reviewed by the maintainers."
