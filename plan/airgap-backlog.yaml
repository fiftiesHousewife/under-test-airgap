  - key: "native-libraries-judged-by-class-loader"
    status: "done"
    notes: "Done: a class is the JDK's when the class loader just above the class path can see it, and reflection and method-handle frames are skipped when finding the class asking. Proposed in A native library is the JDK's own only when a JDK class loader can see the class asking for it."
    type: "deliverable"
    title: "A native library counts as the JDK's own only when the JDK's own class loader asks for it, however it is called"
    parent: "the-agent-refuses-and-reports-every-ordinary-risky-call"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "ai"
    done_when:
      - "A library loaded by a class in a com.sun., javax. or sun. package from the class path, as JNA's is, is refused"
      - "A load made through reflection is judged by the class that made it, not by the reflection classes"
