    type: "deliverable"
    title: "Hooks for JNDI and LDAP lookups, starting processes, loading native code and ending the JVM"
    status: "done"
    notes: "Starting processes came in 0.1.0. JNDI names (URLs with the LDAP, RMI, DNS and CORBA schemes, and a context's provider URL) are refused with CommunicationException. Native libraries are refused with UnsatisfiedLinkError, except the JDK's own and the build tool's own, and can be allowed with native:name. System.exit and Runtime.halt are refused with SecurityException, only while a test is running. Each is proved on JDK 8, 11, 17, 21 and 25 and checked at start. Decided in An exit is refused only while a test is running, and Native libraries are refused unless allowed, except the JDK's and the build tool's own."
    parent: "the-agent-refuses-and-reports-every-ordinary-risky-call"
    phase: "set-up"
    horizon: "next"
    owner_role: "Technical Architect"
    done_by: "ai"
