    notes: "Done: found by the running-old-code-unplugged lesson. Hooks on HttpClientImpl's private sendAsync and its executor hand each of a request's tasks the sender's test, allowances and calling line (HandOver); proved on JDK 11, 17, 21 and 25 with a client made before the test, and shown to fail without the hand-over. A test's @AllowCalls now reaches the client's threads too. JDK 17 and later retry a refused connect once, so a request gives two lines."
