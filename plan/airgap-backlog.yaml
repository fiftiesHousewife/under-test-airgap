    title: "A native library is the JDK's own only when a JDK class loader can see the class asking for it"
    parent: "the-agent-refuses-and-reports-every-ordinary-risky-call"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
