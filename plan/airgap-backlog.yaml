  - key: "every-route-in-the-jdk-passes-a-hook"
    status: "done"
    notes: "Done: jdkRoutesOnJdk<version> in the agent's build, part of check, passes on JDK 8, 11, 17, 21 and 25, on macOS and on Linux CI (with real SCTP). It found five routes round the hooks, now hooked and tested: the socket a SocketChannel hands out (JDK 13+), InetAddress.isReachable, the JDK's own name lookups in SocketPermission, security policies and RMI (the lookup hook moved down to the private getAllByName0), JDK 22's SymbolLookup.libraryLookup, and SCTP. The safe routes left are on agent/src/jdkRoutes/resources/example/airgap/routes/reviewed-routes.txt, each with why."
    type: "deliverable"
    title: "A test reads each supported JDK's own classes and fails if any public route to the network, a process, a native library or an exit doesn't pass a hook"
    parent: "the-agent-refuses-and-reports-every-ordinary-risky-call"
    phase: "set-up"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "ai"
