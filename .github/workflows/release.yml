# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes a release when a version tag (v1.2.3) is pushed, and only if every check passes first: the agent's tests on
# JDK 8, 11, 17, 21 and 25, and the Gradle plugin's sample build on Gradle 5.6, 6.9, 7.6, 8.14 and 9.
#
# Publishes the agent, airgap-junit, the Maven extension and the Gradle plugin to Maven Central, the plugin to the
# Gradle Plugin Portal, and a GitHub release with the jars and their software bills of materials. Needs these
# repository secrets:
#   CENTRAL_PORTAL_USERNAME, CENTRAL_PORTAL_PASSWORD  a Central Portal user token
#   SIGNING_KEY, SIGNING_KEY_PASSWORD                 an ASCII-armoured PGP private key, and its passphrase
#   GRADLE_PUBLISH_KEY, GRADLE_PUBLISH_SECRET         a Gradle Plugin Portal API key
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/build.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Check the tag is a version and every secret is set
        run: |
          case "${VERSION#v}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "The tag $VERSION isn't a version such as v1.2.3"; exit 1 ;;
          esac
          for name in ORG_GRADLE_PROJECT_centralPortalUsername ORG_GRADLE_PROJECT_centralPortalPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            if [ -z "${!name}" ]; then echo "The secret behind $name isn't set"; exit 1; fi
          done
      - name: Publish to Maven Central
        run: ./gradlew -Pversion="${VERSION#v}" nmcpPublishAggregationToCentralPortal
      - name: Publish the plugin to the Gradle Plugin Portal
        run: ./gradlew -Pversion="${VERSION#v}" :gradle-plugin:publishPlugins
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION#v}"
          {
            # What's new for users, written for this release in the repo; then what every release says.
            if [ -f "docs/releases/$v.md" ]; then cat "docs/releases/$v.md"; echo; echo "## Published"; echo; fi
            echo "Published to Maven Central as io.github.fiftieshousewife.airgap:airgap-agent, airgap-junit,"
            echo "airgap-maven-extension and airgap-gradle-plugin, and to the Gradle Plugin Portal as the plugin"
            echo "io.github.fiftieshousewife.airgap."
            echo
            echo "Every hook is proved on JDK 8, 11, 17, 21 and 25. The Gradle plugin is proved on Gradle 5.6, 6.9, 7.6, 8.14 and 9,"
            echo "and the Maven extension on Maven 3.6, 3.8, 3.9 and 4."
            echo "Each jar's software bill of materials (CycloneDX) is attached, and published beside it on Maven Central."
          } > release-notes.md
          # Each file is uploaded under its own name (gh's "file#label" changes only the label shown), so the bills of
          # materials are copied to their published names first.
          mkdir -p release-assets
          for part in agent junit maven-extension gradle-plugin; do
            cp "$part/build/libs/airgap-$part-$v.jar" release-assets/
            cp "$part/build/reports/cyclonedx-direct/bom.json" "release-assets/airgap-$part-$v-cyclonedx.json"
          done
          gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --verify-tag release-assets/*
