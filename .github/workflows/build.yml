# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first, and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every JDK the agent supports. The last is the default, and builds; the others run the agent's own tests.
      # JDK 8 comes from Zulu: Temurin's newest JDK 8 build has been served before its download was in place.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v5
      - name: Run all checks, with the agent's tests on every supported JDK and the plugin's on every supported Gradle
        run: >
          ./gradlew check
          -Pairgap.jdk8="$JAVA_HOME_8_X64"
          -Pairgap.jdk11="$JAVA_HOME_11_X64"
          -Pairgap.jdk17="$JAVA_HOME_17_X64"
          -Pairgap.jdk21="$JAVA_HOME_21_X64"
          -Pairgap.jdk25="$JAVA_HOME_25_X64"
      # The agent's own tests again, under strace: anything the operating system saw them do to another machine, a
      # program or a library, that the agent didn't report as allowed, fails the build.
      - name: Install strace
        run: sudo apt-get install --yes --no-install-recommends strace
      - name: Run the agent's tests under strace and check what the operating system saw
        run: |
          maintainer-tools/os-trace/wrap-jdks.sh "$RUNNER_TEMP/traced" "$PWD/build/os-trace"
          ./gradlew :agent:checkOsTrace -Pairgap.osTrace=build/os-trace \
            -Pairgap.jdk8="$RUNNER_TEMP/traced/jdk8" -Pairgap.jdk11="$RUNNER_TEMP/traced/jdk11" \
            -Pairgap.jdk17="$RUNNER_TEMP/traced/jdk17" -Pairgap.jdk21="$RUNNER_TEMP/traced/jdk21" \
            -Pairgap.jdk25="$RUNNER_TEMP/traced/jdk25"
