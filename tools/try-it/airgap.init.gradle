// Runs any Gradle build's tests under the airgap agent, without changing that build:
//
//   ./gradlew test --init-script /path/to/airgap.init.gradle
//
// The agent comes from Maven Central, or from the repository named by -Dairgap.repository=<URL> (a company's own
// repository, say), or from the jar named by -Dairgap.agent=<path>. -Dairgap.version=<version> picks a version.
// The agent is fetched for this script alone: the build's own repositories and dependencies don't change. Each
// project's report goes to <project>/build/airgap/calls.jsonl; no report means no risky calls.
initscript {
    repositories {
        def repository = System.getProperty("airgap.repository")
        if (repository) {
            maven { url repository }
        } else {
            mavenCentral()
        }
    }
    // Gradle reads every class on the script's class path, and Gradle 6 and older can't read the newest JDKs' class
    // files, which the agent carries for those JDKs; there, the agent gets a configuration of its own. Gradle 9
    // doesn't allow one, and Gradle 7 and later read the agent's classes, so it goes on the class path there.
    def ownConfiguration = org.gradle.util.GradleVersion.current() < org.gradle.util.GradleVersion.version("7.0")
    if (ownConfiguration) {
        configurations.maybeCreate("airgapAgent")
    }
    dependencies {
        if (!System.getProperty("airgap.agent")) {
            add(ownConfiguration ? "airgapAgent" : "classpath",
                    "io.github.fiftieshousewife.airgap:airgap-agent:${System.getProperty("airgap.version", "0.1.0")}")
        }
    }
}

def agentJar = System.getProperty("airgap.agent")
        ? new File(System.getProperty("airgap.agent"))
        : (initscript.configurations.findByName("airgapAgent") ?: initscript.configurations.classpath).files
            .find { it.name.startsWith("airgap-agent-") }

allprojects {
    tasks.withType(Test).configureEach { test ->
        def report = new File(test.project.layout.buildDirectory.get().asFile, "airgap/calls.jsonl")
        test.doFirst {
            if (agentJar == null || !agentJar.isFile()) {
                throw new GradleException("airgap agent not found at ${agentJar}: pass -Dairgap.agent=<path to the jar>")
            }
            report.delete()
        }
        test.jvmArgs("-javaagent:${agentJar.absolutePath}=report=${report.absolutePath}")
        test.outputs.upToDateWhen { false }
        test.doLast {
            if (report.isFile()) {
                logger.lifecycle("airgap: ${test.path} made risky calls; see ${report}")
            }
        }
    }
}
